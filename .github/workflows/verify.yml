name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly rot check, Monday 05:17 UTC (off the hour to avoid the cron stampede).
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      snippets: ${{ steps.pick.outputs.snippets }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
      - id: pick
        name: Choose snippets to verify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          all=$(uv run tools/verify.py --list-json)

          # Scheduled and manual runs check everything; that's the point of them.
          if [[ "$EVENT" == "schedule" || "$EVENT" == "workflow_dispatch" || -z "${BASE_SHA//0/}" ]]; then
            echo "snippets=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi

          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          # Changes to shared tooling or config can break any snippet.
          if grep -qE '^(tools/|pyproject\.toml|\.github/)' <<<"$changed"; then
            echo "snippets=$all" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # "|| true": no snippet changes (e.g. a README typo at the root) is not an error.
          picked=$({ grep -oP '^snippets/\K[^/_.][^/]*(?=/)' <<<"$changed" || true; } | sort -u \
            | jq -R -s -c --argjson all "$all" 'split("\n") | map(select(length > 0)) | map(select(. as $s | $all | index($s)))')
          echo "snippets=${picked:-[]}" >> "$GITHUB_OUTPUT"

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv tool run --from 'ruff>=0.16' ruff check tools
      - run: uv tool run --from 'ruff>=0.16' ruff format --check tools
      - run: >-
          uv run --no-project --isolated --python 3.12
          --with 'mypy>=2.3' --with packaging --with pyyaml --with types-pyyaml
          mypy --config-file pyproject.toml tools/verify.py

  verify:
    needs: discover
    if: needs.discover.outputs.snippets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        snippet: ${{ fromJSON(needs.discover.outputs.snippets) }}
        # highest: does it still work with today's releases?
        # lowest-direct: do the declared lower bounds actually work?
        resolution: [highest, lowest-direct]
    name: ${{ matrix.snippet }} (${{ matrix.resolution }})
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "snippets/${{ matrix.snippet }}/*.py"
      - name: Verify
        env:
          SNIPPET: ${{ matrix.snippet }}
          RESOLUTION: ${{ matrix.resolution }}
        run: uv run tools/verify.py "$SNIPPET" --resolution "$RESOLUTION" --json-out "status/$SNIPPET-$RESOLUTION.json"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-${{ matrix.snippet }}-${{ matrix.resolution }}
          path: status/
          retention-days: 30

  report:
    # Only full runs (scheduled or manual) produce the canonical status file and file issues.
    needs: verify
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/download-artifact@v8
        with:
          pattern: status-*
          path: status
          merge-multiple: true
      - name: Merge status
        run: uv run tools/verify.py --merge status --json-out status.json
      - uses: actions/upload-artifact@v7
        with:
          name: status
          path: status.json
          retention-days: 90
      - name: Open or update rot issue
        if: needs.verify.result == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const status = JSON.parse(fs.readFileSync("status.json", "utf8"));
            const broken = Object.entries(status).flatMap(([name, s]) =>
              Object.entries(s.runs).filter(([, r]) => !r.ok)
                .map(([res, r]) => `- \`${name}\` (${res}): ${r.failed_steps.join(", ")}`));
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Scheduled verification failed.\n\n${broken.join("\n")}\n\n[Run log](${runUrl})`;
            const label = "snippet-rot";
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: label, per_page: 1,
            });
            if (open.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: "Snippets failing verification", body, labels: [label] });
            }

  publish:
    # Publishes status.json to the `status` branch so the site's content bundle can read it
    # without credentials. commit.txt names the commit that was verified, so the site imports
    # exactly the snippets the status describes. The branch is a single generated commit.
    needs: report
    if: always() && needs.report.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: status
          path: out
      - name: Push to the status branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        working-directory: out
        run: |
          set -euo pipefail
          echo "$SHA" > commit.txt
          git init -q -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json commit.txt
          git commit -qm "Status for $SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" status

  notify-site:
    # Tells mikepreston.org that the published status moved, so it rebuilds its content bundle
    # now instead of at its next daily run. It follows `publish`, not a push: the site imports
    # the commit the status describes, so a push to main changes nothing there until a full
    # run has verified it and published the result.
    #
    # Needs SITE_DISPATCH_TOKEN: a fine-grained token with Contents: read and write on
    # Darkflib/mikepreston.org (what GitHub requires to send a repository_dispatch). Without
    # the secret this passes with a warning; with an expired one it fails, so it gets renewed.
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send content-changed
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set, so the site was not notified. It will rebuild on its daily run."
            exit 0
          fi
          gh api -X POST repos/Darkflib/mikepreston.org/dispatches \
            -f event_type=content-changed \
            -f "client_payload[repo]=$SOURCE_REPO" \
            -f "client_payload[sha]=$SOURCE_SHA"
          echo "Asked Darkflib/mikepreston.org to rebuild its content bundle for $SOURCE_SHA."

  site-import:
    # Runs the site's own importer and linter over every snippet, into a scratch directory:
    # does each README project into a page the site will accept? tools/verify.py checks that
    # a snippet runs; this checks the other half, with the code that will actually publish it.
    # Every snippet is checked whether or not it has been verified yet, since a pull request
    # is where a new one first appears.
    #
    # Needs SITE_READ_TOKEN: a fine-grained token with Contents: read on
    # Darkflib/mikepreston.org (private). Without it (always the case for a pull request from
    # a fork) the job passes with a warning. This repo is public, so this job's log is too:
    # it prints snippet names and lint findings, nothing from the site repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Look for the site token
        id: token
        env:
          SITE_READ_TOKEN: ${{ secrets.SITE_READ_TOKEN }}
        run: |
          if [ -n "$SITE_READ_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SITE_READ_TOKEN is not set, so the site import check was skipped."
          fi
      - name: Check out the site's importer
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          repository: Darkflib/mikepreston.org
          token: ${{ secrets.SITE_READ_TOKEN }}
          path: .site
          sparse-checkout: |
            api
            public
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
        if: steps.token.outputs.present == 'true'
      - name: Import and lint as the site would
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/site-content"
          uv run --project .site/api --frozen mp-content import \
            --field-notes-from . --include-unverified --content-dir "$out" --yes
          uv run --project .site/api --frozen mp-content check --content-dir "$out"
